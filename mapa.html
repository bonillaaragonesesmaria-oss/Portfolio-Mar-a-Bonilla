<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La isla de María · Portafolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--crema:#fff8e6;--tinta:#6b5a45;--verde:#3fb58f;--amarillo:#f7c531;--rosa:#f58aa5}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#7fd6d0;font-family:Fredoka,'Arial Rounded MT Bold','Trebuchet MS',sans-serif;color:var(--tinta);-webkit-tap-highlight-color:transparent}
  #mundo{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
  button{font:inherit;color:inherit;cursor:pointer;border:0}
  .pill{background:var(--crema);border-radius:999px;box-shadow:0 4px 0 rgba(60,50,30,.15);padding:8px 18px;font-weight:600}
  #reloj{position:fixed;top:14px;left:14px;display:flex;gap:10px;align-items:center;font-size:15px}
  #reloj b{color:var(--verde);font-size:19px}
  #acciones{position:fixed;top:14px;right:14px;display:flex;gap:8px}
  #acciones button{font-size:15px}
  #acciones button:hover,.chip:hover{background:#fff}
  #ayuda{position:fixed;left:14px;bottom:14px;font-size:13px;font-weight:500;opacity:.9;max-width:60vw}
  #aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);font-size:17px;display:none;align-items:center;gap:10px;white-space:nowrap;animation:sube .25s ease-out}
  #aviso i{font-style:normal;background:var(--amarillo);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:14px;font-weight:700}
  @keyframes sube{from{transform:translate(-50%,12px);opacity:0}}
  /* Diálogo */
  #dlg{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(720px,94vw);background:var(--crema);border-radius:64px/56px;padding:36px 48px 34px;font-size:22px;line-height:1.35;font-weight:500;box-shadow:0 8px 0 rgba(60,50,30,.14);display:none;min-height:128px;cursor:pointer;animation:pop .22s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}}
  #dlgNombre{position:absolute;top:-16px;left:44px;background:var(--c,#f58aa5);color:#fff;padding:3px 20px;border-radius:999px;transform:rotate(-4deg);font-weight:600;font-size:18px}
  #dlgSig{position:absolute;right:44px;bottom:12px;color:var(--amarillo);font-size:20px;animation:bota .6s ease-in-out infinite alternate;visibility:hidden}
  @keyframes bota{to{transform:translateY(5px)}}
  /* Paneles */
  #velo{position:fixed;inset:0;background:rgba(40,70,70,.35);display:none;place-items:center;padding:16px}
  .panel{background:var(--crema);border-radius:36px;width:min(860px,100%);max-height:92vh;overflow:auto;box-shadow:0 10px 0 rgba(60,50,30,.16);animation:pop2 .25s cubic-bezier(.3,1.4,.5,1);position:relative}
  @keyframes pop2{from{transform:scale(.9);opacity:0}}
  .panel header{background:var(--c,#3fb58f);color:#fff;padding:22px 30px 18px;border-radius:36px 36px 0 0}
  .panel header small{display:block;font-weight:500;opacity:.9;letter-spacing:.04em;text-transform:uppercase;font-size:12px}
  .panel header h2{margin:2px 0 0;font-size:30px;line-height:1.1}
  .cuerpo{padding:22px 30px 28px;display:grid;grid-template-columns:1fr 1.2fr;gap:24px}
  .foto{border-radius:22px;min-height:220px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 14px,transparent 14px 28px),var(--c,#3fb58f);display:grid;place-items:center;color:#fff;font-weight:600;text-align:center;padding:16px;font-size:14px}
  .cuerpo p{margin:0 0 14px;font-size:17px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;padding:0;list-style:none}
  .chips li{background:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500}
  .btn{display:inline-block;background:var(--amarillo);color:#5b4a14;text-decoration:none;font-weight:600;padding:10px 22px;border-radius:999px;box-shadow:0 4px 0 #d9a514}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a514}
  .cerrar{position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.3);color:#fff;font-size:20px;font-weight:700}
  .lista{padding:22px 30px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .chip{background:#fff;border-radius:20px;padding:12px 16px;text-align:left;font-weight:600;font-size:16px;box-shadow:0 3px 0 rgba(60,50,30,.1)}
  .chip small{display:block;font-weight:400;font-size:13px;opacity:.8}
  .exp{margin:0 0 14px;padding:0;list-style:none}.exp li{background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:8px;font-size:15px}.exp b{display:block}
  @media (max-width:640px){
    .cuerpo{grid-template-columns:1fr}.foto{min-height:150px}
    #dlg{font-size:18px;padding:30px 30px 28px;border-radius:44px}
    #ayuda{display:none}#reloj{font-size:13px}#acciones button{font-size:13px;padding:8px 12px}
  }
  .npc .bob{animation:respira 1.6s ease-in-out infinite alternate;transform-origin:0 0}
  @keyframes respira{to{transform:scaleY(1.04) translateY(-1px)}}
  .marca{animation:bota .7s ease-in-out infinite alternate}
  @media (prefers-reduced-motion:reduce){.npc .bob,.marca,#dlgSig{animation:none}}
  /* Mapa que se arrastra */
  #mundo{cursor:grab}#mundo:active{cursor:grabbing}
  [data-id]{cursor:pointer}
  .edif .in{transition:transform .2s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:50% 100%}
  .edif:hover .in,.edif.activo .in{transform:translateY(-6px) scale(1.06)}
  #zoom{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
  #zoom button{width:46px;height:46px;padding:0;font-size:24px;line-height:1}
  #panel{position:fixed;top:14px;right:14px;bottom:14px;width:min(440px,calc(100vw - 28px));background:var(--crema);border-radius:32px;box-shadow:0 10px 0 rgba(60,50,30,.16);overflow:auto;display:none;animation:entra .3s cubic-bezier(.3,1.3,.5,1)}
  @keyframes entra{from{transform:translateX(40px);opacity:0}}
  @keyframes entraM{from{transform:translateY(40px);opacity:0}}
  #panel header{background:var(--c);color:#fff;padding:56px 26px 18px;border-radius:32px 32px 0 0}
  #panel header small{display:block;font-weight:500;opacity:.92;letter-spacing:.04em;text-transform:uppercase;font-size:12px}
  #panel header h2{margin:2px 0 0;font-size:28px;line-height:1.1}
  .volver{position:absolute;top:13px;left:14px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 16px;font-weight:600;font-size:14px}
  .pc{padding:18px 22px 26px}
  .pc p{font-size:16px;line-height:1.5;margin:0 0 14px}
  .habla{display:flex;gap:10px;align-items:flex-end;margin-bottom:16px}
  .habla svg{width:62px;flex:none}
  .habla p{background:#fff;border-radius:22px 22px 22px 6px;padding:12px 16px;margin:0;font-size:15px}
  .habla b{color:var(--c);display:block}
  .pc .foto{min-height:190px;margin-bottom:16px}
  .pc .lista{padding:0;grid-template-columns:1fr}
  @media (max-width:640px){#panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:64vh;animation-name:entraM}#zoom{display:none}#acciones{top:auto;bottom:14px;left:10px;right:10px;justify-content:center}}
</style>
</head>

const sombra=(rx,ry=12,y=2)=>`<ellipse cx="0" cy="${y}" rx="${rx}" ry="${ry}" fill="#1f4a35" opacity=".22"/>`;
const ventana=(x,y,s=22)=>`<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="6" fill="#fff"/><rect x="${x+3}" y="${y+3}" width="${s-6}" height="${s-6}" rx="4" fill="#ffe89a"/><path d="M${x+s/2} ${y+3}v${s-6}M${x+3} ${y+s/2}h${s-6}" stroke="#fff" stroke-width="2.5"/>`;
const puerta=(x,c,w=26,h=38)=>`<path d="M${x-w/2} 0v${-(h-w/2)}a${w/2} ${w/2} 0 0 1 ${w} 0V0z" fill="${c}"/><path d="M${x-w/2+4} 0v${-(h-w/2)}a${w/2-4} ${w/2-4} 0 0 1 ${w-8} 0V0z" fill="#fff" opacity=".18"/><circle cx="${x+w/2-7}" cy="-14" r="2.6" fill="#ffe89a"/>`;
const cuerpo=(hw,h,c)=>`<rect x="${-hw}" y="${-h}" width="${hw*2}" height="${h}" rx="10" fill="${c}"/><rect x="${-hw}" y="${-h}" width="${hw*2}" height="${h}" rx="10" fill="url(#shade)"/><rect x="${-hw}" y="-9" width="${hw*2}" height="9" rx="4" fill="#000" opacity=".1"/>`;
const tejado=(hw,h,rh,c)=>{const d=`M${-hw-16} ${-h+8}L${hw+16} ${-h+8}L${hw-10} ${-h-rh}L${-hw+10} ${-h-rh}Z`;
  return `<path d="${d}" fill="${c}" stroke="${c}" stroke-width="14" stroke-linejoin="round"/><path d="${d}" fill="url(#teja)"/><path d="M${-hw+12} ${-h-rh-3}H${hw-12}" stroke="#fff" stroke-opacity=".4" stroke-width="7" stroke-linecap="round"/><rect x="${-hw}" y="${-h+13}" width="${hw*2}" height="7" fill="#000" opacity=".12"/>`;};
const toldo=(hw,y,a,b)=>{let s='',n=6,w=(hw*2+12)/n;for(let i=0;i<n;i++){const x=-hw-6+i*w;s+=`<path d="M${x} ${y}h${w}v16a${w/2} ${w/2} 0 0 1 ${-w} 0z" fill="${i%2?a:b}"/>`;}return s+`<rect x="${-hw-6}" y="${y+18}" width="${hw*2+12}" height="6" fill="#000" opacity=".1"/>`;};

/* Decoración sembrada (siempre sale igual) */
let sem=20261110;const rnd=()=>{sem|=0;sem=sem+0x6D2B79F5|0;let t=Math.imul(sem^sem>>>15,1|sem);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const libre=(x,y,m,mc)=>enIsla(x,y)&&enIsla(x-m,y)&&enIsla(x+m,y)&&enIsla(x,y-m*1.7)&&enIsla(x,y+m*.6)
 &&LUGARES.every(p=>Math.abs(p.x-x)>(p.hw+34)*ESC+m||y<p.y-230||y>p.y+70+m*2.6)
 &&muestras.every(q=>Math.hypot(q[0]-x,q[1]-y)>mc)&&agua.every(q=>Math.hypot(q[0]-x,q[1]-y)>mc+16)
 &&Math.hypot(x-820,y-720)>150&&!(Math.abs(x-1185)<190&&y>120&&y<350);
const puestos=[];
function sembrar(n,m,mc,sep,f){let c=0,i=0;while(c<n&&i++<5000){const x=240+rnd()*1560,y=190+rnd()*1080;if(!libre(x,y,m,mc)||puestos.some(q=>Math.hypot(q[0]-x,(q[1]-y)*1.4)<sep))continue;puestos.push([x,y]);f(x,y);c++;}}

/* ============================================================
   CÁMARA: arrastrar, zoom y viaje a un edificio
   ============================================================ */
const C={x:1000,y:700,z:0};let vw,vh,zmin,abierto=false,anim=0;
const movil=()=>vw<=640;
function medir(){vw=innerWidth;vh=innerHeight;zmin=Math.min(vw/1900,vh/1300);if(!C.z){C.z=Math.max(zmin,vh/1400*.75);if(movil()){C.x=820;C.y=640;}}aplicar();}
function aplicar(){C.z=Math.max(zmin,Math.min(Math.max(zmin*3.4,1.5),C.z));const w=vw/C.z,h=vh/C.z,pr=abierto&&!movil()?480/C.z:0,pb=abierto&&movil()?vh*.62/C.z:0;
 C.x=Math.max(Math.min(w/2,1000),Math.min(Math.max(2000-w/2,1000)+pr,C.x));C.y=Math.max(Math.min(h/2,700),Math.min(Math.max(1400-h/2,700)+pb,C.y));
 svg.setAttribute('viewBox',`${(C.x-w/2).toFixed(1)} ${(C.y-h/2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);}
function irA(x,y,z,ms=650){cancelAnimationFrame(anim);const a={x:C.x,y:C.y,z:C.z},t0=performance.now();
 const f=t=>{let k=Math.min(1,(t-t0)/ms);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;C.z=a.z+(z-a.z)*k;C.x=a.x+(x-a.x)*k;C.y=a.y+(y-a.y)*k;aplicar();if(k<1)anim=requestAnimationFrame(f);};anim=requestAnimationFrame(f);}
function zoomEn(f,sx=vw/2,sy=vh/2){cancelAnimationFrame(anim);const wx=C.x+(sx-vw/2)/C.z,wy=C.y+(sy-vh/2)/C.z;C.z*=f;aplicar();C.x=wx-(sx-vw/2)/C.z;C.y=wy-(sy-vh/2)/C.z;aplicar();}
addEventListener('resize',medir);
const dedos=new Map();let arr=null,movido=false,pellizco=null;
svg.addEventListener('pointerdown',e=>{cancelAnimationFrame(anim);dedos.set(e.pointerId,[e.clientX,e.clientY]);
 if(dedos.size==1){movido=false;arr={x:e.clientX,y:e.clientY,cx:C.x,cy:C.y,t:e.target};}
 if(dedos.size==2){const[a,b]=[...dedos.values()];pellizco={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:C.z};movido=true;}
 try{svg.setPointerCapture(e.pointerId);}catch(_){}});
svg.addEventListener('pointermove',e=>{if(!dedos.has(e.pointerId))return;dedos.set(e.pointerId,[e.clientX,e.clientY]);
 if(dedos.size==2&&pellizco){const[a,b]=[...dedos.values()];zoomEn(pellizco.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pellizco.d/C.z,(a[0]+b[0])/2,(a[1]+b[1])/2);return;}
 if(!arr)return;const dx=e.clientX-arr.x,dy=e.clientY-arr.y;if(Math.hypot(dx,dy)>6)movido=true;if(movido){C.x=arr.cx-dx/C.z;C.y=arr.cy-dy/C.z;aplicar();}});
function suelta(e){if(!dedos.has(e.pointerId))return;dedos.delete(e.pointerId);if(dedos.size<2)pellizco=null;
 if(dedos.size==0){if(!movido&&arr){const g=arr.t.closest&&arr.t.closest('[data-id]');if(g)elegir(L(g.dataset.id));else if(abierto)cerrar();}arr=null;}
 else{const[q]=[...dedos.values()];arr={x:q[0],y:q[1],cx:C.x,cy:C.y,t:svg};}}
svg.addEventListener('pointerup',suelta);svg.addEventListener('pointercancel',suelta);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomEn(Math.exp(-e.deltaY*.0016),e.clientX,e.clientY);},{passive:false});

/* ============================================================
   PANEL de cada sitio
   ============================================================ */
const panel=document.getElementById('panel');
const esc_=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mostrar(html,color){panel.innerHTML=`<button class="volver">← Volver al mapa</button>`+html;panel.style.setProperty('--c',color);panel.style.display='none';void panel.offsetWidth;panel.style.display='block';panel.scrollTop=0;abierto=true;panel.querySelector('.volver').onclick=cerrar;}
function cerrar(){panel.style.display='none';abierto=false;document.querySelectorAll('.edif.activo').forEach(n=>n.classList.remove('activo'));aplicar();}
function elegir(p){document.querySelectorAll('.edif.activo').forEach(n=>n.classList.remove('activo'));p.el.classList.add('activo');
 if(p.ficha=='menu')menu(false,p);else ficha(p);
 const z=Math.max(C.z,movil()?vh/1400*1.25:Math.max(zmin*1.9,.95));
 irA(movil()?p.x:p.x+235/z,movil()?p.y-90+vh*.3/z:p.y-90,z);}
function avatar(p){if(p.npc)return `<svg viewBox="-36 -104 72 110">${vecino(p.npc)}</svg>`;if(p.habla=='María')return `<svg viewBox="-36 -92 72 98">${maria()}</svg>`;return'';}
function ficha(p){const f=p.ficha||{titulo:p.nombre,pre:p.sub};
 const habla=`<div class="habla">${avatar(p)}<p><b>${esc_(p.habla)}</b>${esc_(p.lineas.join(' '))}</p></div>`;
 const resto=p.ficha?`<div class="foto" style="position:relative;overflow:hidden">${p.sub=='Proyecto'?`<img src="portadas/${p.id}.jpg" alt="Portada de ${esc_(f.titulo)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()">`:''}Aquí irán las imágenes de<br>«${esc_(f.titulo)}»</div>`+(f.txt?`<p>${esc_(f.txt)}</p>`:'')+(f.exp?`<ul class="exp">${f.exp.map(e=>`<li><b>${esc_(e[0])}</b>${esc_(e[1])}</li>`).join('')}</ul>`:'')+(f.tags?`<ul class="chips">${f.tags.map(t=>`<li>${esc_(t)}</li>`).join('')}</ul>`:'')+`<a class="btn" href="${f.url}" target="_blank" rel="noopener">${esc_(f.cta||'Ver el proyecto completo')}</a>`:'';
 mostrar(`<header><small>${esc_(f.pre)}</small><h2>${esc_(f.titulo)}</h2></header><div class="pc">${habla}${resto}</div>`,p.color);}
function menu(rapido,p){const it=LUGARES.filter(q=>q.ficha&&q.ficha!='menu'&&(!rapido||q.sub=='Proyecto'));
 const habla=p?`<div class="habla">${avatar(p)}<p><b>${esc_(p.habla)}</b>${esc_(p.lineas.join(' '))}</p></div>`:'';
 mostrar(`<header><small>${rapido?'Sin pasear':'La isla de María'}</small><h2>${rapido?'Portafolio rápido':'¿A dónde vamos?'}</h2></header><div class="pc">${habla}<div class="lista">${it.map(q=>`<button class="chip" data-ir="${q.id}">${esc_(rapido?q.ficha.titulo:q.nombre)}<small>${esc_(rapido?q.ficha.pre:q.sub)}</small></button>`).join('')}</div></div>`,rapido?'#f58aa5':'#3fb58f');
 panel.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>elegir(L(b.dataset.ir)));}
document.getElementById('btnMapa').onclick=()=>{cerrar();irA(1000,700,zmin);};
document.getElementById('btnRapido').onclick=()=>menu(true);

/* Reloj y luz del día */
function reloj(){const d=new Date(),h=d.getHours();document.getElementById('fecha').textContent=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});document.getElementById('hora').textContent=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
 const c=document.getElementById('cielo');if(h>=21||h<6){c.setAttribute('fill','#1b2a5a');c.setAttribute('opacity','.38');}else if(h>=18){c.setAttribute('fill','#ff8a4a');c.setAttribute('opacity','.16');}else if(h<8){c.setAttribute('fill','#ffd9a0');c.setAttribute('opacity','.14');}else c.setAttribute('fill','none');}
reloj();setInterval(reloj,20000);
medir();
